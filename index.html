<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Laut yang Menunggu · Moch Akmal Almagribi</title>
    <meta name="author" content="Moch Akmal Almagribi" />
    <meta
      name="google-site-verification"
      content="1C8iGQDCnX7BjjfJqLIJqSzwfNIYUz9J8Mny1yV4klM"
    />
    <meta
      name="description"
      content="Web edukasi ekosistem laut interaktif karya Moch Akmal Almagribi. Laut berubah dari hari ke hari sesuai waktu nyata, dan setiap ikan bisa diketuk untuk belajar."
    />
    <meta property="og:title" content="Laut yang Menunggu" />
    <meta
      property="og:description"
      content="Edukasi ekosistem laut interaktif oleh Moch Akmal Almagribi."
    />
    <meta property="og:type" content="website" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Laut yang Menunggu",
        "inLanguage": "id",
        "applicationCategory": "EducationalApplication",
        "author": { "@type": "Person", "name": "Moch Akmal Almagribi" }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pn: #f5fbfc;
        --ink: #0d2b3a;
        --mut: #47636f;
        --ln: #cde2e9;
        --ac: #0a7d91;
        --u: calc(0.5vmin + 0.5vmax);
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --pn: #10242e;
          --ink: #e4f2f6;
          --mut: #9bb8c4;
          --ln: #25424f;
          --ac: #4cc3d6;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --pn: #10242e;
        --ink: #e4f2f6;
        --mut: #9bb8c4;
        --ln: #25424f;
        --ac: #4cc3d6;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b3a5c;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      h1,
      h2,
      h3 {
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        margin: 0;
      }
      #scene {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #sky {
        position: absolute;
        inset: 0 0 auto 0;
        height: 18%;
        background: linear-gradient(#8fd3f0, #dff4fa);
      }
      #sun {
        position: absolute;
        top: 14%;
        right: 16%;
        width: 7vmin;
        height: 7vmin;
        border-radius: 50%;
        background: #ffe38a;
      }
      .cl {
        position: absolute;
        top: var(--t);
        left: -20vw;
        width: var(--w);
        height: 3vmin;
        border-radius: 3vmin;
        background: #fff;
        opacity: 0.85;
        animation: cl var(--d) linear infinite;
        animation-delay: var(--dl);
      }
      @keyframes cl {
        to {
          transform: translateX(130vw);
        }
      }
      #haze {
        position: absolute;
        inset: 0 0 auto 0;
        height: 18%;
        background: #8a8566;
        opacity: 0;
        transition: opacity 2s;
      }
      #water {
        position: absolute;
        inset: 17% 0 0 0;
        background: linear-gradient(#35bfd0, #1783a8 45%, #0a3d62);
      }
      #rays {
        position: absolute;
        inset: 17% 0 45% 0;
        pointer-events: none;
      }
      #rays i {
        position: absolute;
        top: 0;
        height: 100%;
        width: 8vw;
        left: var(--l);
        background: linear-gradient(rgba(255, 255, 255, 0.26), transparent);
        transform: skewX(-14deg);
        animation: ray 7s ease-in-out infinite alternate;
        animation-delay: var(--dl);
      }
      @keyframes ray {
        from {
          opacity: 0.3;
        }
        to {
          opacity: 1;
        }
      }
      #sand {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 17%;
      }
      #sand svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      #bed {
        position: absolute;
        inset: auto 0 0 0;
        height: 34%;
        pointer-events: none;
      }
      #bed > * {
        position: absolute;
        bottom: var(--b);
        left: var(--x);
        width: calc(var(--u) * var(--w));
      }
      #bed svg {
        display: block;
        width: 100%;
        overflow: visible;
      }
      .wd {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: sw 4s ease-in-out infinite alternate;
      }
      @keyframes sw {
        from {
          transform: rotate(-7deg);
        }
        to {
          transform: rotate(7deg);
        }
      }
      #layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .c {
        position: absolute;
        left: 0;
        top: 0;
        cursor: pointer;
        pointer-events: auto;
        will-change: transform;
        transition: opacity 5s linear;
      }
      .c::after {
        content: "";
        position: absolute;
        inset: -12px;
      }
      .in {
        transition: transform 0.45s;
      }
      .c svg {
        display: block;
        width: 100%;
        overflow: visible;
      }
      .t {
        position: absolute;
        left: 0;
        top: 0;
      }
      .t svg {
        display: block;
        width: 100%;
      }
      .tl {
        transform-box: fill-box;
        transform-origin: 100% 50%;
        animation: tw 0.5s ease-in-out infinite alternate;
      }
      @keyframes tw {
        to {
          transform: rotate(18deg);
        }
      }
      .fl {
        transform-box: fill-box;
        transform-origin: 20% 50%;
        animation: fp 1.6s ease-in-out infinite alternate;
      }
      @keyframes fp {
        to {
          transform: rotate(-24deg);
        }
      }
      .jd {
        transform-box: fill-box;
        transform-origin: 50% 0;
        animation: pu 2.2s ease-in-out infinite;
      }
      @keyframes pu {
        50% {
          transform: scale(1.12, 0.82);
        }
      }
      .jt {
        transform-box: fill-box;
        transform-origin: 50% 0;
        animation: jt 2.2s ease-in-out infinite;
      }
      @keyframes jt {
        50% {
          transform: scaleY(1.1) skewX(4deg);
        }
      }
      #tint {
        position: absolute;
        inset: 17% 0 0 0;
        background: linear-gradient(#6b6a2a, #3a3418);
        opacity: 0;
        pointer-events: none;
        transition: opacity 2s;
      }
      .bub {
        position: absolute;
        bottom: -12px;
        left: var(--l);
        width: var(--s);
        height: var(--s);
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        animation: bu var(--d) linear infinite;
        animation-delay: var(--dl);
        pointer-events: none;
      }
      @keyframes bu {
        to {
          transform: translateY(-82vh);
        }
      }
      #ferry {
        position: absolute;
        left: 0;
        top: 0;
        width: min(230px, 48vw);
        z-index: 3;
        pointer-events: none;
        will-change: transform;
      }
      #ferry svg {
        display: block;
        width: 100%;
        transition: transform 0.5s;
      }
      .bob {
        animation: bob 4s ease-in-out infinite alternate;
      }
      @keyframes bob {
        from {
          transform: rotate(-1.2deg);
        }
        to {
          transform: rotate(1.2deg) translateY(3px);
        }
      }
      .arm {
        transform-box: fill-box;
        transform-origin: 0 100%;
        animation: th 1.1s ease-in-out infinite alternate;
      }
      @keyframes th {
        to {
          transform: rotate(-65deg);
        }
      }
      #wave {
        position: absolute;
        left: 0;
        top: calc(17% - 11px);
        width: 200%;
        height: 24px;
        z-index: 4;
        animation: wv 9s linear infinite;
        pointer-events: none;
      }
      @keyframes wv {
        to {
          transform: translateX(-50%);
        }
      }
      .card {
        position: absolute;
        z-index: 6;
        top: calc(10px + env(safe-area-inset-top, 0px));
        left: 12px;
        background: rgba(6, 36, 54, 0.6);
        color: #fff;
        border-radius: 16px;
        padding: 9px 13px;
        width: min(210px, 56vw);
      }
      .card h1 {
        font-size: 15px;
        font-weight: 800;
      }
      .card small {
        display: block;
        opacity: 0.85;
        font-size: 12px;
        margin-top: 2px;
      }
      .bar {
        height: 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.22);
        margin-top: 7px;
        overflow: hidden;
      }
      #hp {
        height: 100%;
        width: 100%;
        transform-origin: 0 50%;
        transition:
          transform 1.5s,
          background 1.5s;
      }
      #bell {
        position: absolute;
        z-index: 6;
        top: calc(10px + env(safe-area-inset-top, 0px));
        right: 12px;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        border: 0;
        background: rgba(6, 36, 54, 0.65);
        color: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      #bell svg {
        width: 26px;
        height: 26px;
      }
      #bell.un svg {
        animation: rg 2s ease-in-out infinite;
      }
      @keyframes rg {
        0%,
        55%,
        100% {
          transform: rotate(0);
        }
        62% {
          transform: rotate(-14deg);
        }
        70% {
          transform: rotate(12deg);
        }
        78% {
          transform: rotate(-8deg);
        }
        86% {
          transform: rotate(0);
        }
      }
      #bd {
        position: absolute;
        top: -3px;
        right: -3px;
        min-width: 21px;
        height: 21px;
        border-radius: 11px;
        background: #ff5a3c;
        font: 700 12px/21px system-ui;
        text-align: center;
        transform: scale(0);
        transition: transform 0.25s;
      }
      #bd.on {
        transform: scale(1);
      }
      .ft {
        position: absolute;
        z-index: 6;
        left: 12px;
        right: 12px;
        bottom: calc(10px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        pointer-events: none;
      }
      .ft > * {
        pointer-events: auto;
      }
      .hint {
        background: rgba(6, 36, 54, 0.6);
        color: #fff;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 14px;
        width: 100%;
        text-align: center;
        pointer-events: none;
        transition: opacity 0.5s;
      }
      .pill {
        border: 0;
        border-radius: 14px;
        padding: 8px 13px;
        font: 600 12.5px system-ui;
        background: rgba(255, 255, 255, 0.88);
        color: #0d2b3a;
        cursor: pointer;
      }
      #ts {
        position: absolute;
        z-index: 7;
        left: 50%;
        top: calc(70px + env(safe-area-inset-top, 0px));
        max-width: 88vw;
        transform: translate(-50%, -16px);
        opacity: 0;
        transition:
          transform 0.4s,
          opacity 0.4s;
        background: #0d2b3a;
        color: #fff;
        padding: 9px 15px;
        border-radius: 14px;
        font-size: 13.5px;
        pointer-events: none;
        text-align: center;
      }
      #ts.on {
        transform: translate(-50%, 0);
        opacity: 1;
      }
      #pn {
        position: fixed;
        z-index: 9;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(400px, 92vw);
        background: var(--pn);
        color: var(--ink);
        transform: translateX(105%);
        transition: transform 0.35s cubic-bezier(0.2, 0, 0, 1);
        overflow: auto;
        padding: calc(16px + env(safe-area-inset-top, 0px)) 18px
          calc(24px + env(safe-area-inset-bottom, 0px));
        box-shadow: -8px 0 30px rgba(0, 0, 0, 0.3);
      }
      #pn.o {
        transform: none;
      }
      .hd {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .x {
        border: 0;
        background: var(--ln);
        color: var(--ink);
        width: 34px;
        height: 34px;
        border-radius: 50%;
        font-size: 18px;
        cursor: pointer;
      }
      .sub {
        color: var(--mut);
        font-size: 13px;
        margin: 4px 0 8px;
      }
      .ar {
        border: 1px solid var(--ln);
        border-radius: 14px;
        padding: 12px 14px;
        margin: 10px 0;
      }
      .ar h3 {
        font-size: 16px;
        margin-bottom: 4px;
      }
      .ar p {
        margin: 0;
        font-size: 14px;
        line-height: 1.55;
      }
      .ar.lk {
        opacity: 0.55;
      }
      .nw {
        background: #ff5a3c;
        color: #fff;
        font: 700 10.5px system-ui;
        padding: 2px 7px;
        border-radius: 8px;
        margin-left: 8px;
        vertical-align: middle;
      }
      #md {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: end center;
        background: rgba(3, 20, 32, 0.5);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
      }
      #md.o {
        opacity: 1;
        pointer-events: auto;
      }
      .cd {
        background: var(--pn);
        color: var(--ink);
        width: min(480px, 100%);
        max-height: 88dvh;
        overflow: auto;
        border-radius: 22px 22px 0 0;
        padding: 18px 20px calc(24px + env(safe-area-inset-bottom, 0px));
        transform: translateY(30px);
        transition: transform 0.3s;
      }
      #md.o .cd {
        transform: none;
      }
      .pv {
        width: 120px;
        margin: 4px auto 6px;
      }
      .cd h2 {
        font-size: 22px;
        font-weight: 800;
        text-align: center;
      }
      .cd em {
        display: block;
        text-align: center;
        color: var(--mut);
        margin-bottom: 10px;
      }
      .cd dt {
        font:
          800 12px "Bricolage Grotesque",
          system-ui;
        color: var(--ac);
        margin-top: 10px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .cd dd {
        margin: 2px 0 0;
        font-size: 14.5px;
        line-height: 1.55;
      }
      .cd .bad {
        border-left: 4px solid #e0553a;
        padding-left: 10px;
      }
      @media (prefers-reduced-motion: reduce) {
        .bub,
        .cl,
        #rays i,
        #wave,
        .bob,
        .wd {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div id="sky"><div id="sun"></div></div>
      <div id="haze"></div>
      <div id="water"></div>
      <div id="rays"></div>
      <div id="sand">
        <svg viewBox="0 0 1000 100" preserveAspectRatio="none">
          <path
            d="M0 30Q120 4 260 22T520 18T780 26T1000 14V100H0Z"
            fill="#d6bd88"
          />
          <path d="M0 60Q200 44 500 56T1000 48V100H0Z" fill="#c2a46c" />
        </svg>
      </div>
      <div id="bed"></div>
      <div id="layer"></div>
      <div id="tint"></div>
      <div id="ferry"><div class="bob" id="fsv"></div></div>
      <svg id="wave" viewBox="0 0 2400 24" preserveAspectRatio="none">
        <path id="wvp" d="" fill="#35bfd0" />
      </svg>
      <div class="card">
        <h1>Laut yang Menunggu</h1>
        <small><span id="day"></span> · <span id="lv"></span></small>
        <div class="bar"><div id="hp"></div></div>
        <small>Kesehatan laut <span id="hpn"></span>%</small>
      </div>
      <button id="bell" aria-label="Pemberitahuan materi">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-5.4A8 8 0 1 1 21 12Z" />
          <path d="M8 11h8M8 14.5h5" /></svg
        ><span id="bd"></span>
      </button>
      <div id="ts"></div>
      <div class="ft">
        <div class="hint" id="hint">Ketuk ikan untuk mengenalnya</div>
        <button class="pill" id="fw">+1 hari (simulasi)</button
        ><button class="pill" id="rs">Pulihkan laut</button>
      </div>
    </div>
    <aside id="pn" aria-label="Materi">
      <div class="hd">
        <h2>Pemberitahuan</h2>
        <button class="x" id="px" aria-label="Tutup">×</button>
      </div>
      <p class="sub">Materi baru terbuka saat laut berubah.</p>
      <div id="pnb"></div>
    </aside>
    <div id="md"><div class="cd" id="cd"></div></div>
    <script>
      const $ = (s) => document.querySelector(s),
        rand = (a, b) => a + Math.random() * (b - a),
        RM = matchMedia("(prefers-reduced-motion:reduce)").matches;
      const MEM = {},
        st = {
          g: (k) => {
            try {
              return localStorage.getItem(k);
            } catch (e) {
              return MEM[k] || null;
            }
          },
          s: (k, v) => {
            try {
              localStorage.setItem(k, v);
            } catch (e) {
              MEM[k] = v;
            }
          },
        };
      let first = +st.g("laut_first");
      if (!first) {
        first = Date.now();
        st.s("laut_first", first);
      }
      let seen = [];
      try {
        seen = JSON.parse(st.g("laut_seen") || "[]");
      } catch (e) {}
      const scene = $("#scene"),
        layer = $("#layer"),
        R = document.documentElement.style;
      /* ---------- aset gambar ---------- */
      const fish = (b, f, s, d) =>
        `<svg viewBox="-6 -4 112 68"><g class="tl" style="animation-delay:${d}s"><path d="M16 30L-4 12Q3 30-4 48Z" fill="${f}"/></g><path d="M30 11Q46-4 64 11Z" fill="${f}"/><ellipse cx="46" cy="30" rx="35" ry="20" fill="${b}"/>${s}<circle cx="68" cy="26" r="4.5" fill="#fff"/><circle cx="69.5" cy="26" r="2.2" fill="#12202a"/></svg>`;
      const SP = {
        badut: {
          n: "Ikan Badut",
          l: "Amphiprion ocellaris",
          w: 64,
          sp: 55,
          h: "Terumbu karang dangkal yang hangat; berlindung di antara tentakel anemon laut.",
          k: "Hidup berkelompok kecil dan menjaga anemonnya. Semua lahir jantan; yang paling dominan berubah menjadi betina.",
          f: "Lendir di kulitnya membuatnya kebal terhadap sengatan anemon.",
          d: "Karang memutih, anemon ikut memutih, dan ikan badut kehilangan rumahnya.",
          svg: fish(
            "#ff7a1a",
            "#ff7a1a",
            '<rect x="31" y="12" width="7" height="36" fill="#fff"/><rect x="53" y="12" width="6" height="36" fill="#fff"/>',
            0,
          ),
        },
        botana: {
          n: "Botana Biru",
          l: "Paracanthurus hepatus",
          w: 84,
          sp: 70,
          h: "Karang aktif di perairan Indo-Pasifik, termasuk Indonesia.",
          k: "Memakan plankton dan alga. Saat terancam ia menyelip ke celah karang dan menegakkan duri di pangkal ekornya.",
          f: "Anak ikannya kuning dan baru menjadi biru saat dewasa.",
          d: "Celah karang yang rusak berarti hilangnya tempat bersembunyi dari pemangsa.",
          svg: fish(
            "#2a7fe0",
            "#ffd23a",
            '<path d="M66 22Q44 14 22 32Q44 46 66 36Z" fill="#14204a"/>',
            0.1,
          ),
        },
        kepe: {
          n: "Ikan Kepe-kepe",
          l: "Chaetodon sp.",
          w: 74,
          sp: 48,
          h: "Terumbu karang yang sehat dan padat polip karang.",
          k: "Berenang berpasangan dan sering setia pada pasangannya bertahun-tahun. Makanannya polip karang dan invertebrata kecil.",
          f: "Garis hitam di matanya mengaburkan letak mata dari pemangsa.",
          d: "Karena bergantung pada polip karang, ia menjadi penanda kesehatan terumbu. Karang memutih, ia kelaparan.",
          svg: fish(
            "#ffe14d",
            "#ffe14d",
            '<rect x="60" y="17" width="6" height="26" fill="#1b1b1b"/>',
            0.2,
          ),
        },
        kakatua: {
          n: "Ikan Kakatua",
          l: "Scarus sp.",
          w: 96,
          sp: 60,
          h: "Terumbu karang dan padang lamun tropis.",
          k: "Menggigit alga dari karang dengan gigi menyerupai paruh. Malam hari ia tidur di dalam kantung lendir buatannya sendiri.",
          f: "Karang yang ia cerna keluar sebagai pasir putih. Sebagian pantai berpasir terbentuk dari kotorannya.",
          d: "Saat jumlahnya turun, alga tumbuh liar menutupi karang dan terumbu kehilangan petugas kebersihannya.",
          svg: fish(
            "#2dbf9b",
            "#ee6fa3",
            '<ellipse cx="70" cy="34" rx="10" ry="6" fill="#ee6fa3" opacity=".8"/>',
            0.3,
          ),
        },
        penyu: {
          n: "Penyu Hijau",
          l: "Chelonia mydas",
          w: 118,

        $("#hint").style.opacity = 0;
        $("#cd").innerHTML =
          `<div class="pv">${s.svg}</div><h2>${s.n}</h2><em>${s.l}</em><dl><dt>Habitat</dt><dd>${s.h}</dd><dt>Kebiasaan</dt><dd>${s.k}</dd><dt>Tahukah kamu?</dt><dd>${s.f}</dd><dt>Kondisi saat ini</dt><dd class="${p > 0.25 ? "bad" : ""}">${p > 0.25 ? s.d : "Laut masih sehat, ia hidup tenang di habitatnya."}</dd></dl><p style="text-align:center;margin:16px 0 0"><button class="pill" style="background:var(--ln);color:var(--ink)" id="cx">Tutup</button></p>`;
        $("#md").classList.add("o");
        $("#cx").onclick = () => $("#md").classList.remove("o");
      }
      $("#md").onclick = (e) => {
        if (e.target.id === "md") $("#md").classList.remove("o");
      };
      $("#fw").onclick = () => {
        first -= 864e5;
        st.s("laut_first", first);
        apply();
      };
      $("#rs").onclick = () => {
        first = Date.now();
        st.s("laut_first", first);
        apply(true);
        build();
      };
      setInterval(() => apply(), 20000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) apply();
      });
      let rz;
      addEventListener("resize", () => {
        clearTimeout(rz);
        rz = setTimeout(build, 300);
      });
      measure();
      apply(true);
      build();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
